name: Sync fork with upstream
on:
  schedule:
    - cron:  "17 3 * * *"    # 每天凌晨 3:17(UTC)跑一次,分钟请勿用 0(整点高峰易被延迟)
  workflow_dispatch:          # 也允许手动触发
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync ${{ github.repository }} -b main
        env:
          GH_TOKEN: ${{ github.token }}
